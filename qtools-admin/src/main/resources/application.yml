# ============================================================
# 便携化：以下所有绝对路径都由 -Dqtools.home=<盘上根目录> 推导
#   启动示例：java -Dqtools.home=E:/111/project/QTools -jar qtools-admin.jar ...
#   不带 -D 时回落缺省值 E:/111/project/QTools（搬迁后的新根）
#   路径一律用正斜杠 /（Windows 上 Java 与 Node 都接受），避免 YAML 反斜杠转义
# 注意：不要写成 home: ${qtools.home:E:/111/project/QTools} 这种自引用，
#      解析时会触发 Circular placeholder reference
# ============================================================
# 项目相关配置
qtools:
  # 盘上根目录：由 -Dqtools.home 覆盖（系统属性优先级高于本文件），此处为缺省值
  home: E:/111/project/QTools
  # 名称
  name: QTools
  # 版本
  version: 3.9.2
  # 版权年份
  copyrightYear: 2026
  # 文件路径 示例（ Windows配置D:/qtools/uploadPath，Linux配置 /home/qtools/uploadPath）
  profile: '${qtools.home:E:/111/project/QTools}/uploadPath'
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math
  # 【换成自己的媒体内容】两条路（详见 doc/自定义与迁移指南.md）：
  #   A. 通用扫描（现状，仓库版脚本）：scanScript → doc/media-import/scan-media.js，
  #      thumbScript → doc/media-import/build-thumbs.js；两个脚本都只读媒体根，rel_path 相对 --root 计算。
  #      Java 侧只传 nodePath + 脚本 + scanArgs/thumbArgs，另以环境变量注入 MS_FFMPEG（取 ffmpeg）
  #      与 MS_MYSQL（取 mysqlClient）：管理端触发时自动注入，脚本参数里不必再写 --ffmpeg/--mysql
  #      （显式传仍优先）。但 Java 不传媒体根/缩略图根/端口，所以 --root / --thumbs / --port 必须写进 args；
  #      也不注入数据库口令、还会过滤 --truncate/--force，口令只能靠进程环境变量 MYSQL_PWD 或 args 里的 --secret=。
  #   B. 旧 Node 站迁移（原作者历史场景，管理端已不再使用）：import.js + build_thumbs.js（读 index.json）。
  # 媒体库配置（M1 只读接口 + M3 管理端；媒体根只读，软删只移动不真删）
  media:
    # 媒体根目录（只读）
    rootPath: 'E:/111/视频'
    # 缩略图根目录（含 v/p/pv 三个子目录）
    thumbsPath: '${qtools.home:E:/111/project/QTools}/data/media/thumbs'
    # ffmpeg 可执行文件（管理端触发缩略图任务时以 MS_FFMPEG 注入子进程）
    ffmpeg: '${qtools.home:E:/111/project/QTools}/data/media/runtime/ffmpeg.exe'
    # mysql 客户端可执行文件（管理端触发扫描/缩略图任务时以 MS_MYSQL 注入子进程）
    # 留空 = applyMysqlEnv 直接 return，MS_MYSQL 根本不注入（不等于「有默认值」），脚本只能自己从 PATH 找 mysql；
    # 本机 mysql 不在 PATH（只在 tools/mysql/bin 下），留空则管理端按钮一读库就失败，所以这里显式配死
    mysqlClient: '${qtools.home:E:/111/project/QTools}/tools/mysql/bin/mysql.exe'
    # 实时转码并发上限（超出返回 429）
    maxTranscode: 2
    # 硬件转码（P5-B）：编码器由「启动后首次转码 / 管理端自检」时执行 ffmpeg -encoders 探测决定，
    # 结果缓存在内存，可用值见 GET /api/media/admin/config 的 media.transcode.effective
    transcode:
      # auto = h264_nvenc → h264_qsv → libx264（没有显卡就自动落在软件）；
      # 也可写死 software / libx264 / h264_nvenc / hevc_nvenc / av1_nvenc / h264_qsv / hevc_qsv。
      # 写死的编码器不在本机清单里时 WARN 并回退 auto 链；运行期真失败还会回退软件重试一次。
      encoder: auto
      # 硬件编码器的 -preset：nvenc 为 p1(最快)-p7(最清)；软件分支固定 veryfast + zerolatency（保持老行为）
      preset: p4
      # 恒定质量因子：nvenc -cq / qsv -global_quality（1-51，越小越清；码率上限仍由档位决定）
      cq: 23
    # 回收站根目录（软删只在此目录下落文件，恢复时移回原位）
    trashPath: 'E:/111/视频/_媒体站/trash'
    # 重建索引：Node 可执行文件与脚本（doc/media-import/scan-media.js，仓库版通用扫描）
    nodePath: '${qtools.home:E:/111/project/QTools}/tools/node/node.exe'
    scanScript: '${qtools.home:E:/111/project/QTools}/QTools/doc/media-import/scan-media.js'
    # 扫描产物目录（report.md 等），不写回仓库；--out= 由 Java 自动追加，新脚本不认识它，只 WARN 忽略
    scanOutPath: '${qtools.home:E:/111/project/QTools}/uploadPath/media-scan'
    # 路径必须写在这一行里：Java 只传 nodePath + 脚本 + 本行参数，媒体根不由任何键推导
    #   --root=              媒体根（rel_path 相对它计算；漏了脚本直接报错退出）
    #   --port=              本库实例是 3307，脚本默认 3306（漏了连错库，media_* 读出来是全空）
    #   --album-mode=prefix  本库按文件名前缀分册（见 doc/媒体库可移植性方案.md 的「数据现实」）
    # 绝不可带 --truncate（会清 6 张 media_* 表）；旧脚本的 --dir-mode=raw --allow-dup-dir 已无意义，删掉
    scanArgs: '--root=E:/111/视频 --port=3307 --album-mode=prefix --secret=${qtools.home:E:/111/project/QTools}/QTools/qtools-admin/src/main/resources/secret.yml'
    scanTimeoutMinutes: 10
    # 扫描行为细化（P6.00）：自带封面的文件名后缀集合（逗号列表，yml 写成数组）
    #   规则：同一目录里「视频名+后缀.jpg|png|...」与「视频名.mp4|mkv|...」同时存在 →
    #         这张图是该视频的自带封面：不入相册/图片站，只作为视频海报的来源
    #         （media_video.poster_source='file' + poster_file 指向它）。
    #   优先级：scan-media.js 的 --cover-suffixes= > 环境变量 MS_COVER_SUFFIXES（本项由 Java 注入）> 脚本默认值
    #   大小写不敏感、前后空白忽略；留空数组 = 关闭识别（图片照旧全部入库）
    scan:
      coverSuffixes:
        - '-封面'
        - '-cover'
        - '_cover'
        - '_封面'
    # 扫描入库（P5.91 管理端「扫描入库」页）：同一个 scan-media.js，但 --root= / --root-id= 由页面选中的
    # media_root 行决定（不读 scanArgs 里的 --root=），开关由请求决定（--dry-run / --only-video /
    # --only-photo / --limit= / --purge-unclaimed），DB 连接仍来自上面的 scanArgs（--port= / --secret=）
    scanIngestTimeoutMinutes: 30
    # 缩略图增量扫描（type=thumb）：doc/media-import/build-thumbs.js（仓库版：读库取 content_hash 再落盘）
    thumbScript: '${qtools.home:E:/111/project/QTools}/QTools/doc/media-import/build-thumbs.js'
    # 同样必须自带路径：Java 不传 --root/--thumbs；--port 漏了会连 3306 读到空库、一张都不生成
    #   --root=  媒体根（找源文件）  --thumbs=  缩略图根（v/p/pv 三个子目录都写在它下面）
    # 绝不可带 --force，那会忽略 mtime 重建全部 1 万多张
    # 顺序提醒：先跑本项（build-thumbs）生成 <content_hash>.jpg，再让扫描带上 --fix-poster-path 刷新一列
    #   media_video.poster_path（旧的 <id>.jpg → <content_hash>.jpg）；反过来设置，poster_path 会先指向还不存在的文件
    thumbArgs: '--root=E:/111/视频 --thumbs=${qtools.home:E:/111/project/QTools}/data/media/thumbs --port=3307 --secret=${qtools.home:E:/111/project/QTools}/QTools/qtools-admin/src/main/resources/secret.yml'
    thumbTimeoutMinutes: 30
    # ---------------- 维护面板新增的四个按钮（P1-A）：enrich / backfill-hash / fix-poster / export
    # 元数据补齐（mode=enrich）：enrich-meta.js 用 ffprobe 读 dur/w/h/vcodec 回写 media_video（幂等）
    #   enrichScript 缺省就是 ${qtools.home:E:/111/project/QTools}/QTools/doc/media-import/enrich-meta.js，一般不用配
    #   enrichArgs 与 scanArgs 同理必须自带 --root= / --port= / --secret=（Java 不传媒体根与口令）
    enrichArgs: '--root=E:/111/视频 --port=3307 --secret=${qtools.home:E:/111/project/QTools}/QTools/qtools-admin/src/main/resources/secret.yml'
    enrichTimeoutMinutes: 120
    # ffprobe 可执行文件：非空才以 MS_FFPROBE 注入子进程（与 MS_MYSQL 同风格，留空 = 脚本自己从 PATH 找）
    # 优先级：--ffprobe= > MS_FFPROBE > PATH；ffprobe 完全不可用时 enrich-meta.js 直接退出码 1
    ffprobe: '${qtools.home:E:/111/project/QTools}/data/media/runtime/ffprobe.exe'
    # 维护类（mode=backfill-hash / fix-poster）：同样跑 scan-media.js，但不是「一次扫盘」10 分钟的量级
    maintainTimeoutMinutes: 120
    # 便携包导出（mode=export）：export-bundle.js，产物落 exportPath/<yyyyMMdd-HHmmss>/
    #   exportArgs 必须自带 --mysql=（export-bundle.js 不认 MS_MYSQL，只认 --mysql=）与 --root= / --port= / --secret=
    #   --out= 一律由 Java 追加（写了会被过滤）；mysqldump 默认从 mysql 客户端同目录找
    #   exportPath 同时是下载接口的根：GET /api/media/admin/export/download 只允许读它下面
    exportArgs: '--mysql=${qtools.home:E:/111/project/QTools}/tools/mysql/bin/mysql.exe --root=E:/111/视频 --port=3307 --secret=${qtools.home:E:/111/project/QTools}/QTools/qtools-admin/src/main/resources/secret.yml'
    exportPath: '${qtools.home:E:/111/project/QTools}/data/media/export'
    exportTimeoutMinutes: 60
    # ---------------- 作品简介自动生成（P5.47）：模板（纯规则）+ 可选本地模型 ----------------
    # 模板生成：无开关，纯后端拼句（POST /api/media/admin/videos/{id}/synopsis/template），毫秒级、必然可用。
    # 本地模型：**默认关闭**。打开后站端「⚡ 自动生成」默认走模型；模型不可用（503 / 超时）时前端
    #          自动回退模板并在信息栏提示「本地模型未就绪（Ollama 未启动？）」。
    # 两种后端：provider=ollama（/api/generate）或 openai（OpenAI 兼容端点：LM Studio / llama.cpp / vLLM）。
    # 提示词固定（见 SynopsisPrompt.SYSTEM）：P5.53 起主素材是**字幕节选 / 画面描述**（元数据只作一句体裁背景），
    #   提示词硬禁「罗列字段 / 照抄标题 / 写文件名」，素材不足时输出 sentinel「信息不足」→ 接口回 insufficient:true。
    llm:
      # 总开关：false 时 /synopsis/llm 与 mode=llm 的批量任务都回 503（前端不显示任何 AI 字样）
      enabled: false
      # ollama | openai（写 openai* 都按 OpenAI 兼容端点处理，其余按 ollama）
      provider: ollama
      # 留空 = 按 provider 取默认：
      #   ollama → http://127.0.0.1:11434/api/generate
      #   openai → http://127.0.0.1:8080/v1/chat/completions
      baseUrl: 'http://127.0.0.1:11434/api/generate'
      # 模型名：小模型即可（简介只有 2-3 句）；qwen2.5:1.5b / llama3.2:3b 都够
      model: 'qwen2.5:1.5b'
      # 仅 openai provider 需要；本地端点一般留空（留空 = 不发 Authorization 头）
      apiKey: ''
      # 单次生成的读超时（毫秒，小于 1000 按 1000 计）：首次加载模型较慢，别设太小
      timeoutMs: 20000
      # ---------------- P5.53：内容梗概的素材链（字幕 → 画面 → 音频转写） ----------------
      # 字幕节选预算（qtools.media.llm.subtitle.*）：上限 2000 字（SubtitleExcerpt.HEAD_CHARS），
      # 默认 1200 字 —— 实测 1.5B 在 2000 字上会逐句转写台词，1200 字才给摘要。
      subtitle:
        headChars: 1200
        tailChars: 200
      # 画面理解（无字幕时的主路径）：需要先 ollama pull qwen2.5vl:3b（约 3.2GB）
      vision:
        enabled: false
        model: 'qwen2.5vl:3b'
        frames: 5
        width: 512
        timeoutMs: 60000
      # 音频转写（P5.57 接通）：字幕不可信 / 没有字幕时的最后一路，也是「用音频转写重新生成」按钮专走的一路。
      # 便携包：tools/whisper/whisper-cli.exe（whisper.cpp v1.9.5，OpenBLAS CPU 版 —— 官方 x64 CUDA 包只到
      #   12.4/sm_90，本机 RTX 5060 是 sm_120 跑不了；CPU 推理也不跟 ollama 抢那 8GB 显存）
      # 模型：data/models/whisper/ggml-small.bin（466MB；base 更快但中日混排下错词明显更多）
      transcribe:
        enabled: true
        whisperPath: ''
        model: 'ggml-small.bin'
        timeoutMs: 120000
        # auto 判语言在短片 / 音乐上很容易判错（实测 90s 日语被判成韩语），
        # 判错时用 fallbackLanguage 重跑一次（只在第一遍没有可用正文时才重跑）
        language: auto
        fallbackLanguage: ja
        threads: 8
        # 只转「开头 + 结尾」两段：片长超过 head+tail 时不整片解码（120s 预算装不下整片）
        headSeconds: 300
        tailSeconds: 60
    # 允许的跨域来源，逗号分隔；* 仅用于本地开发
    allowOrigins: '*'
    # ---------------- 自动扫描（文件监听）：两层模型 ----------------
    # 部署层（本文件，改完需重启进程）：
    #   allowRuntimeToggle  能力总闸：false = 彻底封掉运行期开关（PUT /watch/config 一律 403、
    #                       pause / resume 不可用），只能直接改 sys_config 后重启。
    #                       给「配置只准落 yml」「不允许随手打开全盘递归监听」的环境用。
    #   debounceSeconds / quietMinutes  只是兜底：sys_config 对应键缺失或值非法时才用。
    # 运行期层（sys_config，改完即时生效；建键脚本 doc/media_watch_config.sql，幂等）：
    #   media.watchEnabled          'false'  是否监听媒体根并自动触发 mode=scan
    #   media.watchDebounceSeconds  '5'      去抖窗口（秒，1-60）：窗口内 N 个事件合并成 1 次扫描
    #   media.watchQuietMinutes     ''       夜间静默（空 = 不静默；HH:mm-HH:mm 或 起始-结束 分钟）
    # 改法：PUT /api/media/admin/watch/config {enabled|debounceSeconds|quietMinutes}，或直接改库（最迟 30s 生效）。
    # 注意：旧的 qtools.media.watch.enabled 已迁移到 sys_config.media.watchEnabled。
    #      监听器现在是常驻 Bean，本文件再写 enabled 不会报错但也不再生效（Spring 忽略未知属性）。
    watch:
      allowRuntimeToggle: true
      debounceSeconds: 5
      quietMinutes: ''
  # 用户端账号体系（M5：app_* 表 / 独立 JWT / AppJwtFilter / 接口前缀 /api/app/**）
  # 与若依后台（sys_user + token.secret + /login）完全隔离：两套身份互不承认
  app:
    jwt:
      # 密钥不入库、不入仓：写在 secret.yml 的 qtools.app.jwt.secret
      # 必须与 token.secret 不同，缺失或与后台相同时启动直接失败
      issuer: qtools-app
      # 有效期（天）
      expireDays: 7
    # 注册：invite 邀请码（私人站点默认）/ open 开放注册
    register:
      mode: invite
      # 预留：邮箱注册 / 手机号注册
      email: false
      phone: false
    # 登录方式：当前只开「用户名 + 密码」
    login:
      password: true
      # 预留：邮箱 + 密码；手机号 + 验证码
      emailPassword: false
      phoneCode: false
    # 预留：验证码通道总开关（false 时 /api/app/auth/code 与 /bind/** 一律 501）
    code:
      enabled: false
    # 登录失败限流：同 IP + 标识，窗口内最多失败次数，超出 429
    security:
      loginMaxAttempts: 5
      loginWindowMinutes: 10
  # 静态托管（M4-A：8080 单端口同时提供用户端 SPA + 管理端 SPA + 已有 API）
  web:
    # 用户端 SPA 构建产物（QTools-C：npm run build）
    userDist: '${qtools.home:E:/111/project/QTools}/QTools-C/dist'
    # 管理端 SPA 构建产物（QTools-M：npm run build:prod）
    adminDist: '${qtools.home:E:/111/project/QTools}/QTools-M/dist'
    # 管理端 SPA 挂载路径（可配，且不得占用 API 前缀）
    adminPath: /admin-ui

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  # 实时 gzip：前端产物不再做 .gz 预压缩（vite-plugin-compression 0.5.1 与 Vite 6 路径不兼容），
  # 改由容器按 Accept-Encoding 压缩文本类响应
  compression:
    enabled: true
    mime-types: text/javascript,application/javascript,text/css,application/json,text/html,text/plain,text/xml,image/svg+xml,application/wasm
    min-response-size: 2048
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    com.qtools: debug
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 加载本地私密配置（数据库密码、JWT 密钥等）：该文件被 .gitignore 排除，缺失时自动跳过
  config:
    import: optional:classpath:secret.yml
  # 静态资源：由 WebSpaConfig 显式注册 /** ，关闭 Boot 默认的 classpath:/static 映射以免抢同一路径
  web:
    resources:
      add-mappings: false
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  data:
    # redis 配置
    redis:
      # 地址
      host: localhost
      # 端口，默认为6379
      port: 6379
      # 数据库索引
      database: 0
      # 密码
      password:
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池中的最小空闲连接
          min-idle: 0
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池的最大数据库连接数
          max-active: 8
          # #连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥：不入库。本地写在 secret.yml，部署用环境变量 TOKEN_SECRET（缺失时会启动报错，属预期的快速失败）
  expireTime: 30

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.qtools.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Springdoc配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
  group-configs:
    - group: 'default'
      display-name: '测试模块'
      paths-to-match: '/**'
      packages-to-scan: com.qtools.web.controller.tool, com.qtools.tool.controller

# 防盗链配置
referer:
  # 防盗链开关
  enabled: false
  # 允许的域名列表
  allowed-domains: localhost,127.0.0.1,qtools.vip,www.qtools.vip

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*
